[workspace]
resolver = "2"
members = ["engine", "search", "match", "cli", "models/conv", "models/nnue", "models/sq", "xtask"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
ort = { version = "2.0.0-rc.13", features = ["download-binaries"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
